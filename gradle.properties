# Gradle JVM. The default 512m heap OOMs during D8 dex merging with the Compose dependency set,
# which surfaces as an opaque "Error while merging dex archives" — not as an obvious OOM.
# 3g fits comfortably in this machine's ~11g total.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true

kotlin.code.style=official
